name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install the package and smoke-test the console scripts
        # Day 22: the deliverable is that `pip install -e .` exposes all five
        # commands, so CI proves it instead of trusting the unit tests alone.
        run: |
          pip install -e .
          for tool in hangman portfolio organizer assistant inventory; do
            "$tool" --version
          done

      - name: Syntax check (py_compile)
        run: python -m compileall -q projects tests conftest.py

      - name: Lint with flake8
        run: flake8 .

      - name: Check formatting with black
        run: black --check .

      - name: Check test isolation (no real I/O)
        run: python tools/io_audit.py --strict

      - name: Property tests (Hypothesis, fixed seed)
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q tests/test_properties.py

      - name: Fuzz smoke test (deterministic corpus)
        run: python tools/fuzz.py --cases 3 --seed 18

      - name: Run test suite under the coverage gate
        # Day 20: the floor is enforced, not merely printed. A drop below 90%
        # line coverage exits 1 and fails the build.
        run: python tools/coverage_gate.py --minimum 90
