name: CI

# Day 24 — the matrix.
#
# Until today every verdict this repository produced came from one runner:
# `ubuntu-latest`. The tools open files, create directories, publish writes with
# `os.replace`, print box-drawing characters and register console scripts — the
# exact places where Windows differs, and where nothing else can tell you.
#
# Twelve cells: ubuntu-latest / macos-latest / windows-latest × 3.10–3.13.
# `tools/ci_matrix.py` audits this file (cells present, fail-fast off, pip cache
# on, bash shell, least-privilege permissions, versions matching
# `pyproject.toml`) and the pytest suite runs that audit, so the declaration
# cannot drift away from the contract in silence.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# One shell for all three operating systems. Windows runners default to
# PowerShell, where the POSIX commands in these steps are syntax errors — and
# where the console scripts are `.exe` files. GitHub's Windows images ship Git
# Bash, so `bash` is the shell that makes one workflow file true everywhere.
defaults:
  run:
    shell: bash

env:
  # Deterministic text I/O on Windows: the loaders are tested against UTF-8
  # fixtures, and the default ANSI code page would decode them differently.
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A red Windows cell must not cancel the macOS and Linux cells: the whole
      # point of the matrix is to see every cell's verdict in one run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Quoted: an unquoted 3.10 is the float 3.1 to a YAML parser.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Twelve cells share one wheel cache instead of downloading
          # pytest/black/hypothesis/mutmut twelve times.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install the package and smoke-test the console scripts
        # Day 22's deliverable is that `pip install -e .` exposes all five
        # commands. The check resolves each command through `shutil.which`, so
        # it passes on POSIX (`hangman`) and on Windows (`hangman.exe`) without
        # a platform branch in the workflow.
        run: |
          pip install -e .
          python - <<'PY'
          import shutil
          import subprocess
          import sys

          failures = []
          for tool in ("hangman", "portfolio", "organizer", "assistant", "inventory"):
              executable = shutil.which(tool)
              if executable is None:
                  failures.append(f"{tool}: not on PATH after `pip install -e .`")
                  continue
              result = subprocess.run(
                  [executable, "--version"], capture_output=True, text=True
              )
              if result.returncode != 0:
                  failures.append(
                      f"{tool} --version exited {result.returncode}: {result.stderr.strip()}"
                  )
          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

      - name: Syntax check (compileall)
        run: python -m compileall -q projects tests datheon tools conftest.py

      - name: Lint with flake8
        run: flake8 .

      - name: Check formatting with black
        run: black --check .

      - name: Run the test suite
        run: pytest -q

      # The heavier gates below are not platform signals: coverage, the I/O
      # audit, the fuzz corpus and the property profile are identical on every
      # runner, so running them twelve times would cost minutes and prove
      # nothing extra. One designated cell owns them.
      - name: Check test isolation (no real I/O)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python tools/io_audit.py --strict

      - name: Audit the CI matrix declaration
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python tools/ci_matrix.py

      - name: Property tests (Hypothesis, fixed seed)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q tests/test_properties.py

      - name: Fuzz smoke test (deterministic corpus)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python tools/fuzz.py --cases 3 --seed 18

      - name: Run test suite under the coverage gate
        # Day 20: the floor is enforced, not merely printed. A drop below 90%
        # line coverage exits 1 and fails the build.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python tools/coverage_gate.py --minimum 90

  distribution:
    # Day 23: the wheel and the sdist are what a user actually installs, so CI
    # builds both, validates their metadata with `twine check`, and installs the
    # wheel into a throwaway virtualenv to run all five console scripts from a
    # directory that is not the checkout. `tools/distribution.py` owns the whole
    # verdict and exits non-zero on any mismatch.
    #
    # Built once, on Linux: the artefacts are pure-Python (`py3-none-any`), so a
    # second build on another OS produces the same wheel and costs minutes.
    name: Build & verify distribution
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2" "twine>=5.1"

      - name: Build, verify and install the artefacts
        run: python tools/distribution.py --json

      - name: Upload the artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: warn

  ci-status:
    # Twelve matrix cells produce twelve independent check runs, and a branch
    # protection rule can only require one status. This job is that status: it
    # runs even when a cell failed, and it fails if any cell — or the
    # distribution job — did not succeed.
    name: CI status
    if: always()
    needs: [lint-and-test, distribution]
    runs-on: ubuntu-latest

    steps:
      - name: Check every cell and the distribution job
        run: |
          matrix="${{ needs.lint-and-test.result }}"
          distribution="${{ needs.distribution.result }}"
          echo "lint-and-test: $matrix"
          echo "distribution:  $distribution"
          status=0
          if [ "$matrix" != "success" ]; then
            echo "::error::the OS × Python matrix did not pass ($matrix)"
            status=1
          fi
          if [ "$distribution" != "success" ]; then
            echo "::error::the distribution job did not pass ($distribution)"
            status=1
          fi
          exit "$status"
