name: Append Day 17 log entry

on:
  push:
    branches: [feat/datheon-day-17-property-tests]

permissions:
  contents: write

jobs:
  append:
    name: Append the Day 17 learning-log entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4

      - name: Append the entry, then remove the temporary files
        run: |
          if [ ! -f docs/day17_entry.md ]; then
            echo "entry already appended; nothing to do"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          log = Path("docs/daily_learning_log.md")
          entry = Path("docs/day17_entry.md").read_text(encoding="utf-8")
          body = log.read_text(encoding="utf-8").rstrip("\n")
          log.write_text(body + "\n\n" + entry, encoding="utf-8")
          PY
          rm -f docs/day17_entry.md .github/workflows/append-day17-log.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/daily_learning_log.md docs/day17_entry.md .github/workflows/append-day17-log.yml
          git commit -m "docs(log): append the Day 17 entry [skip ci]"
          git push
