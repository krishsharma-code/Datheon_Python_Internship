name: Release

# Day 26 — the tag is the release.
#
# Pushing an annotated tag `v1.1.0` runs this workflow: it refuses to publish if
# the tag disagrees with the version the repository declares, builds the wheel
# and the sdist, validates their metadata with `twine check`, takes the release
# notes from `CHANGELOG.md` (there is no second copy of them to drift) and
# attaches both artefacts to the GitHub Release.
#
# The ordering matters. The tag check runs *before* the build, so a mistyped tag
# fails in seconds instead of publishing a Release whose wheel is called
# something else. And nothing here writes a token: the Release is created with
# the `GITHUB_TOKEN` Actions injects, scoped by the `contents: write` permission
# below and nothing more.
#
# `tools/release.py` audits this file — trigger, permissions, tag check, build,
# twine, notes, attached artefacts, no literal credential — and `pytest` runs
# that audit, so the pipeline cannot quietly lose a step.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  publish:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine pyyaml

      # A release tag that does not match `pyproject.toml` is the one mistake
      # this pipeline exists to catch: it produces a wheel whose filename, whose
      # METADATA and whose `--version` banner disagree with the tag the world
      # downloads by.
      - name: Verify the tag matches the declared version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python tools/release.py --tag "${TAG}" --strict

      - name: Build the wheel and the sdist
        run: python -m build

      - name: Validate the artefact metadata
        run: twine check dist/*

      - name: Extract the release notes from the changelog
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python tools/release.py --notes "${TAG}" --notes-file RELEASE_NOTES.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "Datheon Python Internship ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            dist/*
