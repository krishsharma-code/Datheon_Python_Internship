[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | mutants
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "build", "dist", "mutants"]

[tool.mutmut]
source_paths = ["error_catalogue.py"]
pytest_add_cli_args_test_selection = ["tests/test_errors.py"]
also_copy = [
    "conftest.py",
    "errors.py",
    "edge_cases.py",
    "logging_config.py",
    "cli_contract.py",
    "validators.py",
    "persistence.py",
    "caching.py",
    "dataset_loader.py",
    "observability.py",
    "structured_logging.py",
    "profiling.py",
    "fuzzing.py",
    "docs",
    "projects",
    "tools",
]
