# ---------------------------------------------------------------------------
# Day 22 — packaging & entry points
#
# PEP 621 metadata plus one `console_scripts` entry per tool. The five tools
# keep living in `projects/` under their task-pack directories; `datheon/`
# is the importable shim layer that turns them into commands on the user's
# PATH. Nothing here changes how a tool behaves — `hangman --version` and
# `python projects/01_hangman_game/main.py --version` print the same line and
# exit with the same code.
#
#   pip install -e .     ->  hangman, portfolio, organizer, assistant, inventory
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datheon-python-internship"
version = "1.0.0"
description = "Five standard-library Python tools built for the Datheon Python Internship (Batch 01, 2026)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krish Sharma" }]
keywords = ["datheon", "internship", "python", "cli", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Typing :: Typed",
]
# The tools themselves are standard-library only. Anything a developer needs
# lives in the `dev` extra below (and in requirements.txt, which CI uses).
dependencies = []

[project.optional-dependencies]
dev = [
    # Day 23: `tomllib` is standard from 3.11; the 3.10 cell needs the backport.
    "tomli>=2.0; python_version < '3.11'",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "flake8>=6.1",
    "black>=24.1",
    "hypothesis>=6.98",
    # Day 23: building and validating the artefacts. `tools/distribution.py`
    # drives both, and fails loudly (exit 2) when either is missing.
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/krishsharma-code/Datheon_Python_Internship"
Issues = "https://github.com/krishsharma-code/Datheon_Python_Internship/issues"

#: The five commands. Targets are the shims in `datheon/cli/`, which delegate to
#: `projects/<dir>/main.py` — see `datheon/cli/_registry.py`.
[project.scripts]
hangman = "datheon.cli.hangman:main"
portfolio = "datheon.cli.portfolio:main"
organizer = "datheon.cli.organizer:main"
assistant = "datheon.cli.assistant:main"
inventory = "datheon.cli.inventory:main"

[tool.setuptools]
# The shared core modules sit at the repository root and are imported by name
# from the tools and the tests, so they ship as top-level modules rather than
# being moved into a package (that move would touch every import in the repo).
py-modules = [
    "caching",
    "cli_contract",
    "dataset_loader",
    "edge_cases",
    "error_catalogue",
    "errors",
    "fuzzing",
    "logging_config",
    "observability",
    "persistence",
    "profiling",
    "structured_logging",
    "validators",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datheon*", "projects*"]
namespaces = false

[tool.setuptools.package-data]
# The bundled datasets live beside the code that reads them; without this the
# word list and the sample CSVs would be missing from a wheel.
#
# `py.typed` (Day 23) is what makes the `Typing :: Typed` classifier below
# true: without the marker a type checker ignores the annotations in the
# installed package, however complete they are.
"*" = ["data/*.txt", "data/*.csv", "py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | mutants
  | .*\.egg-info
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
# Day 20: measure the shipped code — the five projects and the shared core
# modules — and nothing else. Counting the test files would flatter the number,
# because every line of a test that runs is a covered line.
branch = true
source = ["."]
omit = [
    "tests/*",
    "tools/*",
    "conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
# The floor. Keep in sync with `DEFAULT_MINIMUM` in tools/coverage_gate.py and
# the `--minimum 90` argument in .github/workflows/ci.yml; the tests assert the
# three agree.
fail_under = 90
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "build", "dist", "mutants"]

[tool.mutmut]
source_paths = ["error_catalogue.py"]
pytest_add_cli_args_test_selection = ["tests/test_errors.py"]
also_copy = [
    "conftest.py",
    "errors.py",
    "edge_cases.py",
    "logging_config.py",
    "cli_contract.py",
    "validators.py",
    "persistence.py",
    "caching.py",
    "dataset_loader.py",
    "observability.py",
    "structured_logging.py",
    "profiling.py",
    "fuzzing.py",
    "docs",
    "projects",
    "tools",
]
